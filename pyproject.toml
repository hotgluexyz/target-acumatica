[project]
name = "target-acumatica"
version = "0.1.0"
description = "`target-acumatica` is a Singer target for Acumatica, built with the Hotglue Singer SDK."
authors = [{ name = "Hotglue", email = "engineering@hotglue.com" }]
keywords = [
    "ELT",
    "acumatica",
]
license = "Apache-2.0"
requires-python = ">=3.10,<3.11"
dependencies = [
    "requests>=2.25.1",
    "hotglue-singer-sdk==1.0.53",
]

[project.scripts]
target-acumatica = 'target_acumatica.target:TargetAcumatica.cli'

[dependency-groups]
dev = [
    "pytest>=7",
    "ruff>=0.15",
]

[tool.ruff]
line-length = 100
required-version = ">=0.15"

[tool.ruff.lint]
future-annotations = true
ignore = [
    "COM812",
    "FIX002",
    "TD002",
    "TD003",
]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
  "S101",
]
"target_acumatica/client.py" = [
    "ANN401",
    "D102",
    "I001",
]
"target_acumatica/sinks.py" = [
    "D102",
    "I001",
]
"target_acumatica/target.py" = [
    "RUF012",
    "I001",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[build-system]
requires = ["poetry-core>=1.0.8"]
build-backend = "poetry.core.masonry.api"
